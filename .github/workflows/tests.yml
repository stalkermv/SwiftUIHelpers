name: Tests

on:
  push:
    branches: [ "main", "2.0" ]
  pull_request:
    branches: [ "main", "2.0" ]

jobs:
  macos:
    runs-on: macos-15

    steps:
      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  ios-compile:
    # NOTE: Minimum-runtime (iOS 17) simulator testing is deferred until an iOS 17
    # runtime is available on GitHub-hosted runners. This job compiles for a generic
    # iOS destination to catch build regressions in the meantime.
    runs-on: macos-15

    steps:
      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - uses: actions/checkout@v4

      - name: iOS compile
        run: |
          xcodebuild build \
            -scheme SwiftUIHelpers \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
